[package]
name = "kcs_migrator"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"

[lib]
name = "kcs_migrator"
path = "src/lib.rs"

[[bin]]
name = "kcs-migrator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Narrowed from `full`: this is an HTTP client, not a server. `rt-multi-thread` + `macros`
# back `#[tokio::main]`; `time` backs the request timeouts and the paused-clock tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
